version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: betting-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: betting_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: betting-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:latest
    container_name: betting-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    ports:
      - '7880:7880' # HTTP / WebSocket signaling
      - '7881:7881' # TCP WebRTC fallback
      - '7882:7882/udp' # UDP WebRTC ICE
    environment:
      LIVEKIT_KEYS: 'devkey: secret'
    volumes:
      - ./packages/audio-sdk/livekit.yaml:/etc/livekit.yaml:ro

volumes:
  postgres_data:
  redis_data:
